<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PC Monitor · Presença</title><style>:root{--bg:#0b0d12;--panel:#141821;--line:#252d3d;--text:#edf2f7;--muted:#8a96a8;--cyan:#4de3f2;--green:#61e294;--orange:#ffb454;--red:#ff647c}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#182b47,transparent 36%),var(--bg);color:var(--text);font:14px Inter,system-ui,sans-serif}.wrap{max-width:1180px;margin:auto;padding:32px 20px}.top{display:flex;justify-content:space-between;align-items:end;gap:18px;margin-bottom:28px}.eyebrow{font-size:11px;color:var(--cyan);letter-spacing:.16em;text-transform:uppercase;font-weight:700}.title{font-size:34px;letter-spacing:-.05em;margin:7px 0}.muted,.sub{color:var(--muted)}.summary{display:flex;gap:12px;flex-wrap:wrap}.stat{background:#141821cc;border:1px solid var(--line);border-radius:14px;padding:15px 18px;min-width:150px}.stat b{display:block;font-size:28px;margin-top:6px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.pc{background:linear-gradient(145deg,#171e2a,#11151e);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 15px 40px #0003;animation:in .25s ease both}.pc.offline{opacity:.58}.pc h2{font-size:18px;margin:0 0 5px}.row{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--line)}.badge{font-size:11px;padding:5px 9px;border-radius:99px;color:var(--green);background:#163526}.badge.off{color:var(--muted);background:#242b37}.empty{padding:45px;text-align:center;border:1px dashed var(--line);border-radius:16px;color:var(--muted)}button{background:none;border:1px solid var(--line);color:var(--text);padding:9px 12px;border-radius:9px;cursor:pointer}button:hover,button:focus{border-color:var(--cyan);outline:2px solid #4de3f255}@keyframes in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}@media(max-width:650px){.top{display:block}.summary{margin-top:18px}.title{font-size:28px}}</style></head><body><main class="wrap"><header class="top"><div><div class="eyebrow">PC monitor / presença</div><h1 class="title">Computadores conectados</h1><div class="sub">Atualização automática a cada 15 segundos · sem métricas de hardware</div></div><button id="refresh">Atualizar agora</button></header><section class="summary"><div class="stat"><span class="muted">Online agora</span><b id="online">—</b></div><div class="stat"><span class="muted">Agentes vistos</span><b id="total">—</b></div><div class="stat"><span class="muted">Atualizado</span><b id="time" style="font-size:18px">—</b></div></section><div id="list" class="grid" style="margin-top:20px"><div class="empty">Carregando presença…</div></div></main><script>const API='https://lpbzjbnymyztshjxrbmc.supabase.co';const KEY='sb_publishable_RtbKVnBA45ffDLbSGIU9lQ_pxgjHEpg';const $=id=>document.getElementById(id);function ago(iso){let s=Math.max(0,Date.now()-new Date(iso).getTime())/1000;if(s<60)return Math.round(s)+'s';if(s<3600)return Math.round(s/60)+'min';return Math.round(s/3600)+'h'}function duration(iso){let s=Math.max(0,Date.now()-new Date(iso).getTime())/1000;let d=Math.floor(s/86400);s%=86400;let h=Math.floor(s/3600);s%=3600;let m=Math.floor(s/60);return (d?d+'d ':'')+(h?h+'h ':'')+m+'min'}async function load(){try{let r=await fetch(API+'/rest/v1/agent_presence?select=agent_id,display_name,operating_system,started_at,last_seen,agent_version&order=last_seen.desc',{headers:{apikey:KEY,Authorization:'Bearer '+KEY}});if(!r.ok)throw Error('HTTP '+r.status);let rows=await r.json(), online=rows.filter(x=>Date.now()-new Date(x.last_seen).getTime()<30000);$('online').textContent=online.length;$('total').textContent=rows.length;$('time').textContent=new Date().toLocaleTimeString();$('list').innerHTML='';if(!rows.length){$('list').innerHTML='<div class="empty">Nenhum agente registrado ainda.</div>';return}rows.forEach(x=>{let live=Date.now()-new Date(x.last_seen).getTime()<30000;let el=document.createElement('article');el.className='pc '+(live?'':'offline');el.innerHTML='<div style="display:flex;justify-content:space-between;gap:10px"><div><h2></h2><div class="muted"></div></div><span class="badge '+(live?'':'off')+'">'+(live?'ONLINE':'OFFLINE')+'</span></div><div class="row"><span class="muted">Executando há</span><strong></strong></div><div class="row"><span class="muted">Último heartbeat</span><span></span></div><div class="row"><span class="muted">Versão</span><span></span></div>';let q=el.querySelectorAll('h2,.muted,strong, .row span:last-child');q[0].textContent=x.display_name;q[1].textContent=x.operating_system||'Sistema não informado';q[2].textContent=duration(x.started_at);q[3].textContent=ago(x.last_seen)+' atrás';q[4].textContent=x.agent_version||'—';$('list').appendChild(el)})}catch(e){$('list').innerHTML='<div class="empty">Não foi possível carregar a presença. '+e.message+'</div>'}}$('refresh').onclick=load;load();setInterval(load,15000)</script></body></html>
